name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable release tag containing the candidate commit
        required: true
      expected_sha512:
        description: Base64 SHA-512 of the exact GitHub Release tarball
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Validate release input
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tag must be v<major>.<minor>.<patch>" >&2
            exit 1
          fi
          release_version="${RELEASE_TAG#v}"
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=dsh-grok-provider-$release_version.tgz" >> "$GITHUB_ENV"

      - name: Bind workflow run to immutable tag commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CONTEXT_REF: ${{ github.ref }}
          CONTEXT_REF_NAME: ${{ github.ref_name }}
          CONTEXT_REF_TYPE: ${{ github.ref_type }}
          CONTEXT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$CONTEXT_REF_TYPE" = tag
          test "$CONTEXT_REF" = "refs/tags/$RELEASE_TAG"
          test "$CONTEXT_REF_NAME" = "$RELEASE_TAG"

          ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          test "$(jq -r .ref <<< "$ref_json")" = "refs/tags/$RELEASE_TAG"
          peeled_type="$(jq -r .object.type <<< "$ref_json")"
          peeled_sha="$(jq -r .object.sha <<< "$ref_json")"
          for _ in {1..8}; do
            if [[ "$peeled_type" = commit ]]; then
              break
            fi
            test "$peeled_type" = tag
            tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$peeled_sha")"
            peeled_type="$(jq -r .object.type <<< "$tag_json")"
            peeled_sha="$(jq -r .object.sha <<< "$tag_json")"
          done
          test "$peeled_type" = commit
          test "$peeled_sha" = "$CONTEXT_SHA"

      - name: Validate release and download exact artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          release_json="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,assets)"
          test "$(jq -r .tagName <<< "$release_json")" = "$RELEASE_TAG"
          test "$(jq -r .isDraft <<< "$release_json")" = false
          test "$(jq -r .isPrerelease <<< "$release_json")" = false
          test "$(jq -r '.assets | length' <<< "$release_json")" = 1
          test "$(jq -r '.assets[0].name' <<< "$release_json")" = "$ARTIFACT_NAME"

          mkdir -- release
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ARTIFACT_NAME" \
            --dir release
          mapfile -t downloaded < <(find release -maxdepth 1 -type f -print)
          test "${#downloaded[@]}" -eq 1
          test "${downloaded[0]}" = "release/$ARTIFACT_NAME"

      - name: Verify artifact digest and manifest
        shell: bash
        env:
          EXPECTED_SHA512: ${{ inputs.expected_sha512 }}
        run: |
          set -euo pipefail
          artifact="./release/$ARTIFACT_NAME"
          actual="$(openssl dgst -sha512 -binary "$artifact" | openssl base64 -A)"
          test "$actual" = "$EXPECTED_SHA512"
          test "$(tar -xOf "$artifact" package/package.json | jq -r .name)" = 'dsh-grok-provider'
          test "$(tar -xOf "$artifact" package/package.json | jq -r .version)" = "$RELEASE_VERSION"
          test "$(tar -xOf "$artifact" package/package.json | jq -r .repository.url)" = \
            'git+https://github.com/yoshino-xiao7/dsh-grok-provider.git'

          extract_markdown_section() {
            local heading="$1"
            awk -v heading="$heading" '
              $0 == heading { found = 1; next }
              found && /^## / { exit }
              found { print }
              END { if (!found) exit 1 }
            '
          }

          readme_zh="$(tar -xOf "$artifact" package/README.md)"
          readme_en="$(tar -xOf "$artifact" package/README.en.md)"
          preamble_zh="$(awk '/^## / { exit } { print }' <<< "$readme_zh")"
          preamble_en="$(awk '/^## / { exit } { print }' <<< "$readme_en")"
          quick_start_zh="$(extract_markdown_section '## 快速开始' <<< "$readme_zh")"
          quick_start_en="$(extract_markdown_section '## Quick start' <<< "$readme_en")"
          release_surface_zh="$(printf '%s\n%s\n' "$preamble_zh" "$quick_start_zh")"
          release_surface_en="$(printf '%s\n%s\n' "$preamble_en" "$quick_start_en")"

          printf -v expected_zh_artifact '本说明对应 `dsh-grok-provider@%s` 制品' "$RELEASE_VERSION"
          printf -v expected_zh_readme '本 README 随 `%s` 一起进入 npm tarball，下面的精确安装命令也固定为 `%s`。' \
            "$RELEASE_VERSION" "$RELEASE_VERSION"
          printf -v expected_en_artifact 'This README describes the `dsh-grok-provider@%s` artifact' "$RELEASE_VERSION"
          printf -v expected_en_readme 'This README is included in the `%s` npm tarball, and the exact installation command below is pinned to `%s`.' \
            "$RELEASE_VERSION" "$RELEASE_VERSION"
          grep -Fq "$expected_zh_artifact" <<< "$preamble_zh"
          grep -Fq "$expected_zh_readme" <<< "$preamble_zh"
          grep -Fq "$expected_en_artifact" <<< "$preamble_en"
          grep -Fq "$expected_en_readme" <<< "$preamble_en"

          if grep -Eq '未发布|候选|继续安装' <<< "$release_surface_zh"; then
            echo 'Chinese README preamble or Quick Start contains candidate-state guidance' >&2
            exit 1
          fi
          if grep -Eiq 'unpublished|candidate|continue installing' <<< "$release_surface_en"; then
            echo 'English README preamble or Quick Start contains candidate-state guidance' >&2
            exit 1
          fi

          expected_install="dsh plugin --profile web add dsh-grok-provider@$RELEASE_VERSION"
          mapfile -t install_commands_zh < <(grep -Eo 'dsh plugin --profile web add dsh-grok-provider@[0-9]+\.[0-9]+\.[0-9]+' <<< "$quick_start_zh")
          mapfile -t install_commands_en < <(grep -Eo 'dsh plugin --profile web add dsh-grok-provider@[0-9]+\.[0-9]+\.[0-9]+' <<< "$quick_start_en")
          test "${#install_commands_zh[@]}" -eq 1
          test "${install_commands_zh[0]}" = "$expected_install"
          test "${#install_commands_en[@]}" -eq 1
          test "${install_commands_en[0]}" = "$expected_install"

      - name: Use supported Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org

      - name: Use supported npm CLI
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/npm-cli" --no-save --ignore-scripts npm@11.5.1
          node "$RUNNER_TEMP/npm-cli/node_modules/npm/bin/npm-cli.js" --version

      - name: Publish exact artifact with provenance
        shell: bash
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/npm-cli/node_modules/npm/bin/npm-cli.js" \
            publish "./release/$ARTIFACT_NAME" \
            --access public \
            --tag latest \
            --provenance
